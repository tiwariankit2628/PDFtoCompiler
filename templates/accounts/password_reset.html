{% extends 'base.html' %}

{% block title %}Reset Password | {{ PLATFORM_NAME }}{% endblock %}

{% block content %}
<div class="auth-wrapper">
    <div class="auth-card">
        <div class="text-center mb-4">
            <div class="d-inline-flex align-items-center justify-content-center bg-warning bg-opacity-10 text-warning p-3 rounded-circle mb-3">
                <i class="bi bi-key-fill fs-3"></i>
            </div>
            <h3 class="fw-bold mb-1">Forgot Password?</h3>
            <p class="text-muted small">Enter your email address and we'll send you instructions to reset your password.</p>
        </div>

        <form method="post">
            {% csrf_token %}
            <div class="mb-3">
                <label class="form-label fw-semibold small">Registered Email Address</label>
                <input type="email" name="email" class="form-control" placeholder="name@example.com" required autofocus>
            </div>
            <button type="submit" class="btn btn-primary w-100 py-2 fw-bold shadow-sm">
                <i class="bi bi-envelope-arrow-up me-1"></i> Send Reset Link
            </button>
        </form>

        <div class="text-center mt-4 pt-3 border-top small text-muted">
            Remembered your password? 
            <a href="{% url 'accounts:login' %}" class="fw-semibold text-primary text-decoration-none">
                Back to Sign In &rarr;
            </a>
        </div>
    </div>
</div>
{% endblock %}
