{% extends 'base.html' %}

{% block title %}Password Reset Complete | {{ PLATFORM_NAME }}{% endblock %}

{% block content %}
<div class="auth-wrapper">
    <div class="auth-card text-center">
        <div class="d-inline-flex align-items-center justify-content-center bg-success bg-opacity-10 text-success p-3 rounded-circle mb-3">
            <i class="bi bi-check-circle-fill fs-3"></i>
        </div>
        <h3 class="fw-bold mb-2">Password Reset Complete</h3>
        <p class="text-muted small mb-4">
            Your password has been set. You may now go ahead and sign in with your new password.
        </p>
        <a href="{% url 'accounts:login' %}" class="btn btn-primary w-100 py-2 fw-bold shadow-sm">
            Sign In Now
        </a>
    </div>
</div>
{% endblock %}
